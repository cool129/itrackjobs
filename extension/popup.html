<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; padding: 12px; font-family: system-ui, Segoe UI, sans-serif; font-size: 14px; }

  /* ---- Logo ---- */
  .brand { margin: 2px 0 10px; }
  .logo-wrap { position: relative; display: inline-block; line-height: 0; user-select: none; }
  .logo {
    display: block; height: 30px; width: auto;
    pointer-events: none; user-select: none; -webkit-user-drag: none;
  }
  .logo-shine {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    -webkit-mask: url("logo-light.png") center / 100% 100% no-repeat;
    mask: url("logo-light.png") center / 100% 100% no-repeat;
  }
  .logo-shine::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%;
    background: linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.9) 50%, transparent 100%);
    transform: translateX(-120%);
    will-change: transform;
    animation: logo-shine 6s ease-in-out 1s infinite;
  }
  @keyframes logo-shine {
    0%        { transform: translateX(-120%); }
    70%, 100% { transform: translateX(270%); }
  }
  @media (prefers-reduced-motion: reduce) { .logo-shine { display: none; } }

  /* ---- Form ---- */
  label { display: block; font-size: 12px; color: #6b7280; margin-top: 8px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  button { width: 100%; margin-top: 10px; padding: 8px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  #status { margin-top: 8px; min-height: 1.2em; }
  #settings { display: none; margin-top: 8px; border-top: 1px solid #eee; }
  .link { background: none; color: #6b7280; font-size: 12px; }
</style>
</head>
<body>
  <header class="brand">
    <span class="logo-wrap">
      <picture>
        <source srcset="logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="logo-light.png" alt="iTrackJobs" class="logo" draggable="false">
      </picture>
      <span class="logo-shine" aria-hidden="true"></span>
    </span>
  </header>

  <label>Job title</label>
  <input id="title">
  <label>Company</label>
  <input id="company">
  <label><input type="checkbox" id="auto-log" checked> Auto-log applications</label>
  <button id="save">Log this job</button>
  <div id="status"></div>

  <button class="link" id="toggle-settings">⚙ Settings</button>
  <div id="settings">
    <label>API key</label>
    <input id="api-key" type="password">
    <button id="save-settings">Save key</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
